# =====================================================================
# MM2 Trades · Creator Dashboard — Blueprint de Render
#
# CONFIGURACION DE VISTA PREVIA (plan gratuito, sin coste).
#
# El plan gratuito no admite disco persistente, asi que la base de datos
# vive dentro del despliegue y se borra en cada reinicio. Sirve para ver
# el panel funcionando, NO para uso real: con creadores de verdad se
# perderian saldos y retiros.
#
# Para pasar a produccion, mira la seccion del final de este fichero.
# =====================================================================

services:
  - type: web
    name: mm2-trades-creators
    runtime: node
    plan: free
    region: frankfurt             # cambialo al mas cercano a tu audiencia
    branch: main
    buildCommand: npm ci
    startCommand: npm run start:prod
    healthCheckPath: /api/health

    envVars:
      - key: NODE_ENV
        value: production
      - key: SECURE_COOKIES
        value: "true"             # Render sirve por HTTPS
      - key: SESSION_SECRET
        generateValue: true       # lo genera Render; no se expone

      # Vista previa: crea el creador de demostracion con datos de
      # ejemplo para poder recorrer el panel nada mas desplegar.
      # Ponlo a "false" antes de dar de alta creadores reales.
      - key: SEED_DEMO
        value: "true"

      # Sin DATABASE_FILE, la base de datos se guarda dentro del propio
      # despliegue. La aplicacion lo avisa en los logs al arrancar.

# ---------------------------------------------------------------------
# PARA PRODUCCION
#
# Cuando haya creadores reales, cambia lo siguiente:
#
#   plan: starter                 (el disco persistente requiere pago)
#
#   disk:
#     name: mm2trades-data
#     mountPath: /data
#     sizeGB: 1
#
#   envVars:
#     - key: DATABASE_FILE
#       value: /data/mm2trades.sqlite
#     - key: SEED_DEMO
#       value: "false"
#
# Sin ese disco, cada despliegue borra creadores, saldos y retiros.
# ---------------------------------------------------------------------
